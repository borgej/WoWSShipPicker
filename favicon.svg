<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Navy background circle -->
  <circle cx="32" cy="32" r="30" fill="#0d2137" stroke="#3a6ea8" stroke-width="2"/>

  <!-- Anchor body (gold) -->
  <g fill="none" stroke="#c8a227" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ring at top -->
    <circle cx="32" cy="15" r="5" stroke-width="3" fill="none"/>
    <!-- Vertical shaft -->
    <line x1="32" y1="20" x2="32" y2="51" stroke-width="3.5"/>
    <!-- Cross bar -->
    <line x1="19" y1="27" x2="45" y2="27" stroke-width="3.5"/>
    <!-- Curved base arms -->
    <path d="M32,51 C32,51 18,50 18,42" stroke-width="3.5" fill="none"/>
    <path d="M32,51 C32,51 46,50 46,42" stroke-width="3.5" fill="none"/>
    <!-- Left fluke -->
    <path d="M18,42 L13,47" stroke-width="3.5"/>
    <!-- Right fluke -->
    <path d="M46,42 L51,47" stroke-width="3.5"/>
  </g>

  <!-- Highlight dot on ring -->
  <circle cx="32" cy="15" r="2" fill="#e8c84a"/>
</svg>
